# Every push to main that passes clippy and the tests publishes a
# ready-built Wisp for Linux, signed with minisign, as the newest release.
# FerroOS's updater installs it from there, and only if the signature checks
# out against Wisp's public key (minisign.pub, built into the updater).
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only the jobs that publish may write to the repository.
permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The build (cargo and every crate it compiles) never sees the signing
  # key: it hands the archive to the next job, which signs and publishes it
  # on a runner of its own and runs none of the build's code.
  linux-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Actions and the build image are named by their hash, not by a tag
      # that can be moved to other code: what builds the release that gets
      # signed only changes when this file does.
      # The token isn't left in .git/config, where the build could read it.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Clippy and the tests run first: if either fails, nothing is built.
      - name: Check and build on Debian trixie
        run: >
          docker run --rm -v "$PWD:/src" -w /src -e WISP_COMMIT="$GITHUB_SHA" -e WISP_CHECK=1
          debian:trixie@sha256:9c6e381421d0f48d1b8133e573f33c185ee16cbf505eda9c4a8a4791b25ea8a6
          .github/build-linux.sh dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-unsigned
          path: |
            dist/wisp-linux-x86_64.tar.gz
            dist/wisp-linux-x86_64.tar.gz.sha256
            dist/wisp-commit
          if-no-files-found: error
          retention-days: 1

  # Signs what linux-build made with minisign (secret MINISIGN_SECRET_KEY)
  # and publishes it as the newest release.
  linux:
    needs: linux-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # For minisign.pub and the commit's time; nothing in it is run.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-unsigned
          path: dist

      # The trusted comment names the commit and its time, so the updater
      # can tell this build is the one it was told about, and never goes
      # back to an older one.
      - name: Sign
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          set -eu
          [ -n "$MINISIGN_SECRET_KEY" ] || { echo "MINISIGN_SECRET_KEY isn't set: no release without a signature" >&2; exit 1; }
          # The archive is the one the build summed, and names this commit.
          (cd dist && sha256sum -c wisp-linux-x86_64.tar.gz.sha256)
          [ "$(cat dist/wisp-commit)" = "$GITHUB_SHA" ] || { echo "the build is of another commit" >&2; exit 1; }
          sudo apt-get install -y -q minisign >/dev/null
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$MINISIGN_SECRET_KEY" >"$key"
          when=$(git log -1 --format=%ct "$GITHUB_SHA")
          minisign -S -s "$key" -m dist/wisp-linux-x86_64.tar.gz -t "wisp $GITHUB_SHA $when"
          rm -f "$key"
          # Signed with the key the updater trusts, not some other one.
          minisign -V -p minisign.pub -m dist/wisp-linux-x86_64.tar.gz

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short=$(echo "$GITHUB_SHA" | cut -c1-7)
          gh release create "build-$short" --target "$GITHUB_SHA" --latest \
            --title "Wisp $short" \
            --notes "Wisp for Linux (x86-64), built from $GITHUB_SHA on Debian trixie. Signed with minisign: minisign -Vm wisp-linux-x86_64.tar.gz -P $(tail -1 minisign.pub)" \
            dist/wisp-linux-x86_64.tar.gz dist/wisp-linux-x86_64.tar.gz.sha256 \
            dist/wisp-linux-x86_64.tar.gz.minisig dist/wisp-commit

  # Wisp for Android, added to the same release once the Linux build is out:
  # an Android build that fails never holds up FerroOS's updates. Phones run
  # wisp-android-arm64.apk; wisp-android-x86_64.apk is for the Android
  # emulator. Each is built on its own, so one failing doesn't hold up the other.
  # The build (Gradle and everything it fetches) never sees the signing key:
  # it hands the unsigned APK to the next job, which signs it with Wisp's
  # Android key (secrets ANDROID_KEYSTORE, base64, and
  # ANDROID_KEYSTORE_PASSWORD) on a runner of its own and checks it against
  # android/release-cert.sha256, so each APK installs over the one before.
  android:
    needs: linux
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { abi: arm64-v8a, target: aarch64-linux-android }
          - { abi: x86_64, target: x86_64-linux-android }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The version code counts commits.
          fetch-depth: 0
          persist-credentials: false

      # gradle-wrapper.jar is the one Gradle publishes, not a changed copy.
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Build
        run: |
          set -eu
          export JAVA_HOME="$JAVA_HOME_21_X64" PATH="$JAVA_HOME_21_X64/bin:$PATH"
          sdk="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdk" --licenses >/dev/null || true
          "$sdk" --install "ndk;29.0.14206865" "platforms;android-37.2" "build-tools;36.0.0" >/dev/null
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865"
          rustup target add "${{ matrix.target }}"
          cargo install cargo-ndk --version 4.1.2 --locked
          WISP_VERSION_CODE=$(git rev-list --count "$GITHUB_SHA") WISP_VERSION_NAME="0.1.0-$(echo "$GITHUB_SHA" | cut -c1-7)" \
            android/build-android.sh "${{ matrix.abi }}" release

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-${{ matrix.abi }}
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 1

  android-sign:
    needs: android
    # Each APK whose build went through, even if the other's didn't.
    if: ${{ !cancelled() && needs.android.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { abi: arm64-v8a, apk: wisp-android-arm64.apk }
          - { abi: x86_64, apk: wisp-android-x86_64.apk }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-${{ matrix.abi }}
          path: unsigned

      - name: Sign
        env:
          APK: ${{ matrix.apk }}
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -eu
          [ -n "$ANDROID_KEYSTORE" ] || { echo "ANDROID_KEYSTORE isn't set: no APK without a signature" >&2; exit 1; }
          export PATH="$JAVA_HOME_21_X64/bin:$PATH"
          sdk="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdk" --licenses >/dev/null || true
          "$sdk" --install "build-tools;36.0.0" >/dev/null
          tools="$ANDROID_HOME/build-tools/36.0.0"
          # The key exists only for this step, and is gone after it.
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s' "$ANDROID_KEYSTORE" | base64 -d >"$key"
          WISP_KS_PASS=$(printf '%s' "$ANDROID_KEYSTORE_PASSWORD" | tr -d '\r\n') "$tools/apksigner" sign \
            --ks "$key" --ks-key-alias wisp --ks-pass env:WISP_KS_PASS --key-pass env:WISP_KS_PASS \
            --out "$APK" unsigned/app-release-unsigned.apk
          rm -f "$key"
          # Signed with Wisp's key, not some other one.
          got=$("$tools/apksigner" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          [ "$got" = "$(cat android/release-cert.sha256)" ] || { echo "signed with $got, not Wisp's key" >&2; exit 1; }
          sha256sum "$APK" >"$APK.sha256"
          # Its version code, which Wisp's update check compares with its own.
          "$tools/aapt2" dump badging "$APK" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -n 1 >"$APK.version"
          grep -qE '^[0-9]+$' "$APK.version" || { echo "no version code in $APK" >&2; exit 1; }

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ matrix.apk }}
        run: |
          short=$(echo "$GITHUB_SHA" | cut -c1-7)
          gh release upload "build-$short" "$APK" "$APK.sha256" "$APK.version"
