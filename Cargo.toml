[package]
name = "wisp"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm = "0.11.1"
base64 = "0.23.1"
getrandom = "0.4.3"
gtk = { version = "0.11", package = "gtk4", features = ["v4_18"] }
pbkdf2 = "0.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
webkit6 = { version = "0.6", features = ["v2_52", "gtk_v4_18"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
