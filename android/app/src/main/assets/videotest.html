const rows = [];
function row(name){
  const tr=document.createElement('tr'), a=document.createElement('td'), b=document.createElement('td');
  a.textContent=name; b.textContent='testing…'; b.className='wait';
  tr.append(a,b); document.getElementById('t').append(tr);
  const r={name, result:'testing…'}; rows.push(r);
  return (ok, text) => { b.textContent=text; b.className= ok ? 'ok' : 'bad'; r.result=(ok?'OK ':'FAIL ')+text; if(!ok) console.error('Wisp video test: '+name+': '+text); };
}
function bytes(b64){ const s=atob(b64), u=new Uint8Array(s.length); for(let i=0;i<s.length;i++) u[i]=s.charCodeAt(i); return u; }
function mediaErr(e){ return e ? ('error '+e.code+(e.message?': '+e.message:'')) : 'error (no details)'; }

// Plays an element until it's really moving, or says why not.
function watch(el, done){
  let over=false;
  const finish=(ok,t)=>{ if(over) return; over=true; clearTimeout(timer); done(ok,t); try{el.pause();}catch(e){} };
  const timer=setTimeout(()=>finish(false, 'didn\'t start in 10 s (readyState '+el.readyState+', networkState '+el.networkState+')'), 10000);
  el.addEventListener('error', ()=>finish(false, mediaErr(el.error)));
  el.addEventListener('timeupdate', ()=>{ if(el.currentTime>0.4) finish(true, 'plays ('+(el.videoWidth?el.videoWidth+'×'+el.videoHeight:'audio')+')'); });
  el.muted=true; el.playsInline=true;
  const p=el.play(); if(p) p.catch(e=>finish(false, 'play() refused: '+e.name+' '+e.message));
}
function plain(name, b64, mime, tag){
  const set=row(name);
  try{
    const el=document.createElement(tag); document.getElementById('v').append(el);
    el.src=URL.createObjectURL(new Blob([bytes(b64)],{type:mime}));
    watch(el, set);
  }catch(e){ set(false, e.name+': '+e.message); }
}
function mse(name, b64, type, tag){
  const set=row(name);
  try{
    if(!window.MediaSource){ set(false,'no MediaSource'); return; }
    if(!MediaSource.isTypeSupported(type)){ set(false,'not supported: '+type); return; }
    const ms=new MediaSource(), el=document.createElement(tag); document.getElementById('v').append(el);
    el.src=URL.createObjectURL(ms);
    ms.addEventListener('sourceopen', ()=>{
      try{
        const sb=ms.addSourceBuffer(type);
        sb.addEventListener('error', ()=>set(false,'SourceBuffer error'));
        sb.addEventListener('updateend', ()=>{ try{ if(ms.readyState==='open') ms.endOfStream(); }catch(e){} }, {once:true});
        sb.appendBuffer(bytes(b64));
        watch(el, set);
      }catch(e){ set(false, e.name+': '+e.message); }
    }, {once:true});
  }catch(e){ set(false, e.name+': '+e.message); }
}
