[package]
name = "wisp-core"
version = "0.1.0"
edition = "2024"
description = "Wisp's engine-independent parts: settings, privacy rules, ad-block lists, the vault, history, sync and the plugin API's rules"

[dependencies]
aes-gcm = "0.11.1"
argon2 = { version = "0.6", default-features = false, features = ["alloc"] }
base64 = "0.23.1"
futures-channel = "0.3"
getrandom = "0.4.3"
pbkdf2 = "0.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"

[dev-dependencies]
regex = "1"
