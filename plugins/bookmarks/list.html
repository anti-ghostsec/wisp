<!doctype html>
<meta charset="utf-8">
<title>Bookmarks</title>
<style>
  :root { color-scheme: light dark; --muted: #8889; }
  body { font: 14px system-ui, sans-serif; max-width: 52em; margin: 2em auto; padding: 0 1em; }
  header { display: flex; gap: 1em; align-items: center; }
  h1 { font-weight: 400; margin: 0; flex: 1; }
  input { font: inherit; padding: .5em .8em; border-radius: 6px; border: 1px solid var(--muted); width: 18em; }
  ul { list-style: none; padding: 0; }
  li { display: flex; align-items: center; gap: .8em; padding: .55em .4em; border-bottom: 1px solid #8883; }
  li a { flex: 1; text-decoration: none; color: inherit; overflow: hidden; }
  li a span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  li a small { color: GrayText; }
  button { font: inherit; border: 0; background: none; color: GrayText; cursor: pointer; padding: .2em .5em; border-radius: 4px; }
  button:hover { background: #8883; color: inherit; }
  header button { border: 1px solid #8886; color: inherit; }
  #status { color: GrayText; font-size: .9em; }
  .handle { cursor: grab; color: GrayText; padding: 0 .2em; user-select: none; touch-action: none; }
  li.dragging { opacity: .4; }
  li.over-top { box-shadow: inset 0 2px 0 #3a6ee8; }
  li.over-bottom { box-shadow: inset 0 -2px 0 #3a6ee8; }
  li.editing input { width: auto; flex: 1; }
  button.main { background: #3a6ee8; color: #fff; }
  /* In the toolbar pop-up: compact, and a list you can scroll. */
  .popup body { width: 26em; margin: .7em; padding: 0; }
  .popup h1 { font-size: 1.15em; font-weight: 500; }
  .popup header { gap: .5em; }
  .popup input#q { width: auto; flex: 1; min-width: 0; padding: .35em .6em; }
  .popup header h1 { flex: none; }
  .popup #status { margin: .5em 0; }
  .popup ul { margin: 0; }
  .popup li { padding: .35em .2em; gap: .4em; }
  .popup li button { padding: .2em .35em; }
  #full { display: none; }
  .popup #full { display: inline-block; }
</style>
<header><h1>Bookmarks</h1><input id="q" placeholder="Search bookmarks" autofocus><button id="full" title="Open the bookmarks in a tab">⤢</button><button id="import" title="Import an HTML bookmarks export from Firefox, Chrome, Edge, Brave or Safari">Import…</button><input id="file" type="file" accept=".html,.htm,.json" hidden></header>
<p id="status">Loading…</p>
<ul id="list"></ul>
