<!doctype html>
<meta charset="utf-8">
<title>Saved passwords</title>
<style>
  :root { color-scheme: light dark; --line: #8883; --muted: GrayText; --accent: #3a6ee8; }
  body { font: 14px system-ui, sans-serif; max-width: 60em; margin: 2em auto; padding: 0 1em; }
  header { display: flex; gap: .6em; align-items: center; flex-wrap: wrap; }
  h1 { font-weight: 400; margin: 0; flex: 1; }
  input { font: inherit; padding: .45em .7em; border-radius: 6px; border: 1px solid #8889; background: Canvas; color: CanvasText; }
  #q { width: 16em; }
  button { font: inherit; border: 0; background: none; color: var(--muted); cursor: pointer; padding: .3em .6em; border-radius: 5px; }
  button:hover { background: var(--line); color: inherit; }
  button.main { background: var(--accent); color: #fff; }
  button.main:hover { filter: brightness(1.1); }
  header button { border: 1px solid #8886; color: inherit; }
  table { width: 100%; border-collapse: collapse; margin-top: 1em; table-layout: fixed; }
  td, th { text-align: left; padding: .45em .4em; border-bottom: 1px solid var(--line); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  th { font-weight: 500; color: var(--muted); }
  th:nth-child(1) { width: 28%; } th:nth-child(2) { width: 26%; } th:nth-child(3) { width: 24%; }
  td input { width: 100%; box-sizing: border-box; }
  code { font-size: 1.05em; }
  .actions { text-align: right; }
  #status { color: var(--muted); font-size: .9em; }
  #import-panel { border: 1px solid var(--line); border-radius: 8px; padding: .8em 1em; margin-top: 1em; }
  #import-panel[hidden] { display: none; }
  #import-panel p { margin: .3em 0 .7em; }
  .hint { color: var(--muted); font-size: .9em; }
  .copy-user { display: none; }
  /* In the toolbar pop-up each login is a small block instead of a table
     row: site and user, then the password and the buttons, all in reach. */
  .popup body { width: auto; max-width: none; margin: .7em; padding: 0; }
  .popup h1 { font-size: 1.15em; font-weight: 500; flex: none; }
  .popup header { gap: .4em .3em; flex-wrap: wrap; }
  .popup h1 { flex: 1; }
  .popup #q { order: 9; flex: 1 1 100%; width: auto; min-width: 0; padding: .35em .6em; box-sizing: border-box; }
  .popup header button { padding: .25em .45em; }
  .popup #status { margin: .5em 0 0; }
  .popup thead { display: none; }
  .popup table, .popup tbody { display: block; margin-top: .3em; }
  .popup tr { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: .15em .5em; padding: .5em .1em; border-bottom: 1px solid var(--line); }
  .popup td { display: flex; align-items: center; gap: .2em; padding: 0; border: 0; min-width: 0; }
  .popup td > span, .popup td > a, .popup td > code { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; user-select: text; }
  .popup td:nth-child(1) { grid-column: 1 / -1; font-weight: 500; }
  .popup td:nth-child(2) { grid-column: 1; color: var(--muted); }
  .popup td:nth-child(3) { grid-column: 1; }
  .popup td.actions { grid-column: 2; grid-row: 2 / span 2; flex-direction: column; align-items: stretch; }
  .popup td button { padding: .2em .45em; }
  .popup .copy-user { display: inline-block; }
  .popup tr.editing td { grid-column: 1 / -1; grid-row: auto; flex-direction: row; justify-content: flex-end; }
  .popup tr.editing td input { flex: 1; }
  #full { display: none; }
  .popup #full { display: inline-block; }
</style>
<header>
  <h1>Passwords</h1>
  <input id="q" type="search" placeholder="Search" autofocus>
  <button id="add">Add</button>
  <button id="import">Import…</button>
  <button id="full" title="Open the passwords in a tab">⤢</button>
  <input id="file" type="file" accept=".csv,.json,text/csv,application/json" hidden>
</header>
<div id="import-panel" hidden>
  <p id="import-summary"></p>
  <button id="import-go" class="main">Import</button>
  <button id="import-cancel">Cancel</button>
</div>
<p id="status">Loading…</p>
<p class="hint" id="import-hint" hidden>Import a CSV or JSON export from Firefox, Chrome, Edge, Brave, Safari, Proton Pass, Bitwarden or KeePassXC.
In Proton Pass: Settings → Export → CSV (unencrypted).</p>
<table><thead><tr><th>Site</th><th>Username</th><th>Password</th><th></th></tr></thead><tbody id="rows"></tbody></table>
